<style>
/* Layout: harita solda tam yükseklik, sağda kadastro defteri gibi parsel listesi; telefonda harita üstte, liste altta */
:root {
  --bg: #f3f4f0;
  --panel: #fbfbf8;
  --fg: #1d221c;
  --muted: #646b60;
  --line: #d9dcd2;
  --accent: #2f6b3a;
  --hover: #e8ebe1;
  --momBg: #fbf3d6;
  --momLine: #e8d48a;
  --momFg: #8a6400;
  --warn: #b3261e;
  --warnBg: #fbeceb;
  --warnLine: #ebc3bf;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141713; --panel: #1b1f1a; --fg: #e6e9e1; --muted: #9aa294; --line: #2e342c; --accent: #8fcf8f; --hover: #252b23;
  --momBg: #2a2614; --momLine: #5a4d1c; --momFg: #f2c14e; --warn: #ff8a80; --warnBg: #2c1918; --warnLine: #5c2b28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141713; --panel: #1b1f1a; --fg: #e6e9e1; --muted: #9aa294; --line: #2e342c; --accent: #8fcf8f; --hover: #252b23;
  --momBg: #2a2614; --momLine: #5a4d1c; --momFg: #f2c14e; --warn: #ff8a80; --warnBg: #2c1918; --warnLine: #5c2b28; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; }
.leaflet-bar a.reset { display: flex; align-items: center; justify-content: center; color: #222; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
#map { height: 100%; background: #2a2f28; }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.head { padding-block: 18px 14px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .01em; text-wrap: balance; }
.stats { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
.stats div { display: grid; gap: 2px; }
.stats b { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
.chip i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] i { background: transparent; outline: 1.5px solid var(--c); outline-offset: -1.5px; }
.chip:focus-visible, .row:focus-visible, .tools input:focus-visible, .tools select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; gap: 8px; }
.tools input, .tools select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.tools input { flex: 1; min-width: 0; }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; padding-block: 9px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); cursor: pointer; }
.row:hover { background: var(--hover); }
.row.on { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.row .sw { width: 6px; height: 30px; border-radius: 2px; background: var(--c); }
.row .pn { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.row .pn em { font-style: normal; color: var(--muted); font-weight: 400; }
.row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .area { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.row .area small { display: block; color: var(--muted); font-size: 11px; }
.foot { padding-block: 10px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.5; }
.empty { padding: 24px 18px; color: var(--muted); }
.tools select { flex: 0 1 auto; min-width: 0; max-width: 50%; }
aside { min-width: 0; }
.head { grid-template-columns: minmax(0, 1fr); }
.mode { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--fg); padding: 4px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
.seg button:focus-visible, .wchip:focus-visible, .infobtn:focus-visible, .wbox button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.legend i { width: 18px; height: 10px; border-radius: 2px; background: var(--c); }
.legend[hidden] { display: none; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wchips > span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.wchip { display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer; }
.wchip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.wchip[aria-pressed="true"] { border-style: solid; border-color: var(--warn); background: var(--warnBg); }
.row .pn .wi { margin-left: 6px; color: var(--warn); font-size: 12px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.infobtn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 0; padding: 2px 0; cursor: pointer; }
.infobtn svg { flex: none; }
.infobtn:hover { color: var(--fg); }
.wbox { margin: 8px 0 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--warnLine); background: var(--warnBg); }
.wbox .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.wbox .tags span { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--warnLine); }
.wbox .tags span.sev { color: var(--warn); border-color: var(--warn); font-weight: 600; }
.wbox .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; }
.wbox button { font: inherit; font-size: 12px; color: var(--accent); background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
dialog.sheet { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: min(80vh, 720px); }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .5); }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.sheet .x { font: inherit; font-size: 20px; line-height: 1; background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; }
.sheet .sb { padding: 12px 16px 16px; font-size: 13px; line-height: 1.5; }
.sheet .sb p { margin: 0 0 10px; }
.sheet ul { list-style: none; margin: 0; padding: 0; }
.sheet li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sheet li .c { grid-row: 1 / span 2; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--warnLine); align-self: start; white-space: nowrap; }
.sheet li .c.sev { color: var(--warn); border-color: var(--warn); }
.sheet li .w { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet li .w b { color: var(--momFg); font-weight: 600; }
.sheet .note { margin-top: 12px; font-size: 12px; color: var(--muted); }
.sheet table { grid-column: 2; width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.sheet td { padding: 5px 6px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.sheet td.a { text-align: right; white-space: nowrap; font-weight: 600; }
.sheet td small { display: block; color: var(--muted); }
.tomap { display: none; }

const packFor = z => z <= 15 ? "lo" : String(z);
function loadPack(name) {
  if (packs[name] || pending[name]) return pending[name] || Promise.resolve();
  const el = document.getElementById("loading");
  if (name !== "lo") el.hidden = false;
  pending[name] = fetch(`tiles/${name}.json`).then(r => r.json()).then(d => { packs[name] = d; })
    .catch(() => { packs[name] = {}; })
    .finally(() => { delete pending[name]; el.hidden = Object.keys(pending).length === 0; });
  return pending[name];
}
const PackLayer = L.TileLayer.extend({

    const b = p[`${c.z}/${c.x}/${c.y}`];
    return b ? "data:image/jpeg;base64," + b : BLANK;
  }
});

const active = new Set(Object.keys(COLORS));
let selected = null;
const layers = {};
// Paya göre: annemizin m² payı beş dilimde açıktan koyuya
let colorMode = "tur";
const PAYCOL = ["#fff3b0", "#ffd166", "#f59e3b", "#e4572e", "#a4161a"];
const PAYCUT = [10, 50, 150, 400];
const payBin = m2 => PAYCUT.filter(c => m2 >= c).length;
const colorOf = f => colorMode === "pay" ? PAYCOL[payBin(momM2(f.properties.parsel))] : COLORS[f.properties.nitelik];
const style = (f, on) => {
  const c = colorOf(f), pay = colorMode === "pay";
  return { color: on ? "#ffffff" : c, weight: on ? 3.5 : 2, fillColor: c, fillOpacity: on ? 0.6 : pay ? 0.6 : 0.32 };
};

function videoHtml(pn) {
  return (VIDEOS[pn] || []).map(v => `<a class="vid" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">
    <span class="vp" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></svg></span>
    <span><b>Videoyu izle</b><small>${v.len}${v.with.length ? ` · ${v.with.join(", ")} ile birlikte` : ""}</small></span></a>`).join("");
}

function ownersHtml(pn) {
  const o = OWNERS[pn]; if (!o) return "";
  const mom = o.rows.find(r => r.mom), others = o.rows.filter(r => !r.mom);
  const max = Math.max(...others.map(r => r.pct), 1);
  const momBox = mom ? `<div class="mom">
    <div class="nm">${mom.name}</div>
    <div class="big"><b>${mom.pay}</b><span>${pctFmt(mom.pct)} · ${fmt(mom.m2, 2)} m²</span></div>
    <div class="parts">${mom.parts.length > 1
      ? mom.parts.map(x => x.pay).join(" + ") + " iki hisse kaydının toplamı" +
        (mom.parts.some(x => x.ad.endsWith("Selek")) ? " (biri kızlık soyadı Selek ile kayıtlı)" : "")
      : `${mom.parts[0].edinme}, ${mom.parts[0].tarih.replaceAll("-", ".")}`}</div></div>` : "";
  const li = others.map(r => `<li><span class="n">${r.name}</span>
    <span class="p">${r.pay}<small>${pctFmt(r.pct)}</small></span>
    <span class="f">${r.father ? `${r.father} ${r.rel}` : "Kurum"} · ${fmt(r.m2, 2)} m²${r.parts ? ` · ${r.parts.length} kayıt` : ""}</span>
    <span class="bar"><i style="width:${Math.max(2, r.pct / max * 100)}%"></i></span></li>`).join("");
  return momBox + `<div class="own"><h4><span>Diğer ortaklar</span><span>${others.length} kişi</span></h4><ol>${li}</ol></div>`;
}

function warnHtml(pn) {
  const cs = wcats(pn); if (!cs.length) return "";
  const order = Object.keys(WCATS).filter(c => cs.includes(c));
  return `<div class="wbox"><div class="hd"><span>${severe(pn) ? "⚠ " : ""}Tapu kayıtlarında ${order.length} konu</span><button type="button" data-w="${pn}">Ayrıntılar</button></div>
    <div class="tags">${order.map(c => `<span${SEVERE.has(c) ? ' class="sev"' : ""}>${WCATS[c]}</span>`).join("")}</div></div>`;
}

function popupHtml(p, c) {
  const tkgm = `https://parselsorgu.tkgm.gov.tr/#ara/idari/144099/${p.ada}/${p.parsel}/1`;
  const gm = `https://www.google.com/maps/search/?api=1&query=${c.lat.toFixed(6)},${c.lng.toFixed(6)}`;
  return `<div class="pop"><h3>Parsel ${p.parsel}</h3>
    <div class="meta">${p.nitelik} · ${p.mevkii} · ${fmt(p.alan, 2)} m² (${fmt(p.alan / 1000, 2)} dönüm)<br><span>Taşınmaz No ${p.tasinmazNo}</span></div>
    ${videoHtml(p.parsel)}
    ${ownersHtml(p.parsel)}
    ${warnHtml(p.parsel)}
    <div class="links"><a href="${gm}" target="_blank" rel="noopener">Google Haritalar'da aç</a><a href="${tkgm}" target="_blank" rel="noopener">TKGM</a></div></div>`;
}

feats.forEach(f => {
  const lyr = L.geoJSON(f, { style: () => style(f, false) });
  const center = lyr.getBounds().getCenter();
  lyr.bindPopup(() => popupHtml(f.properties, center), { maxWidth: 340, minWidth: 280, autoPanPadding: [12, 12] });
  lyr.bindTooltip(f.properties.parsel + (severe(f.properties.parsel) ? " ⚠" : ""), { permanent: true, direction: "center", className: "plabel" });
  lyr.on("click", () => select(f.properties.parsel, false));
  layers[f.properties.parsel] = { lyr, f };
});

function syncLabels() {
  document.getElementById("map").classList.toggle("nolabels", map.getZoom() < 15.5);
}
map.on("zoomend", syncLabels);

function select(pn, fly) {
  if (selected && layers[selected]) layers[selected].lyr.setStyle(style(layers[selected].f, false));
  selected = pn;
  const { lyr, f } = layers[pn];
  lyr.setStyle(style(f, true)); lyr.bringToFront();
  if (fly) {
    // Telefonda liste haritanın altında; seçilen parseli görmek için haritaya çık
    if (matchMedia("(max-width: 760px)").matches) document.getElementById("map").scrollIntoView({ block: "start" });
    map.flyToBounds(lyr.getBounds(), { maxZoom: 18, padding: [40, 40], duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.8 });
    map.once("moveend", () => lyr.openPopup(lyr.getBounds().getCenter()));
  }
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("on", r.dataset.p === pn));
  // Haritadan seçimde sayfayı kaydırma; listeyi yalnızca kendi kutusu içinde kaydır (masaüstü)
  const row = document.querySelector(`.row[data-p="${pn}"]`), list = document.getElementById("list");
  if (row && !fly && list.scrollHeight > list.clientHeight) {
    const top = row.offsetTop - list.offsetTop;
    if (top < list.scrollTop || top + row.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = top - list.clientHeight / 2;
  }
}

function momShare(pn) {
  const m = OWNERS[pn] && OWNERS[pn].rows.find(r => r.mom);
  return m ? `<span class="mp">${m.pay}</span> · ${fmt(m.m2, 1)} m²` : "";
}

const q = document.getElementById("q"), sortSel = document.getElementById("sort");
const wactive = new Set();
function visible() {
  const s = q.value.trim().toLocaleLowerCase("tr");
  return feats.filter(f => active.has(f.properties.nitelik) &&
    (!wactive.size || wcats(f.properties.parsel).some(c => wactive.has(c))) &&
    (!s || f.properties.parsel.includes(s) || f.properties.mevkii.toLocaleLowerCase("tr").includes(s)));
}
function render() {
  const vis = visible(), ids = new Set(vis.map(f => f.properties.parsel));
  Object.entries(layers).forEach(([pn, { lyr }]) => ids.has(pn) ? lyr.addTo(map) : lyr.remove());
  syncLabels();
  const k = sortSel.value;
  vis.sort((a, b) => k === "pay" ? momM2(b.properties.parsel) - momM2(a.properties.parsel)
    : k === "alan" ? b.properties.alan - a.properties.alan
    : k === "mevkii" ? a.properties.mevkii.localeCompare(b.properties.mevkii, "tr") || +a.properties.parsel - +b.properties.parsel
    : +a.properties.parsel - +b.properties.parsel);
  const list = document.getElementById("list");
  list.innerHTML = vis.length ? vis.map(f => { const p = f.properties; return `
    <button class="row${p.parsel === selected ? " on" : ""}" data-p="${p.parsel}" style="--c:${colorOf(f)}">
      <span class="sw"></span>
      <span><div class="pn">${p.parsel}${severe(p.parsel) ? '<span class="wi" title="Tapu kaydında önemli not var">⚠</span>' : ""}</div><div class="sub">${p.nitelik} · ${p.mevkii}${p.hisseKayit > 1 ? " · 2 hisse kaydı" : ""}</div></span>
      <span class="area">${fmt(p.alan)} m²<small>${momShare(p.parsel)}</small></span>
    </button>`; }).join("") : `<div class="empty">Bu filtreyle eşleşen parsel yok.</div>`;
  const tot = vis.reduce((s, f) => s + f.properties.alan, 0);
  document.getElementById("stats").innerHTML =
    `<div><b>${vis.length}</b><span>Parsel</span></div><div><b>${fmt(tot / 1000, 1)}</b><span>Dönüm</span></div><div><b>${fmt(tot)}</b><span>m²</span></div>`;
}
document.getElementById("list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) select(r.dataset.p, true); });
q.addEventListener("input", render);
sortSel.addEventListener("change", render);

const counts = {};

document.getElementById("chips").innerHTML = Object.keys(COLORS).filter(n => counts[n])
  .sort((a, b) => counts[b] - counts[a])
  .map(n => `<button class="chip" aria-pressed="true" data-n="${n}" style="--c:${COLORS[n]}"><i></i>${n} <small>${counts[n]}</small></button>`).join("");
document.getElementById("chips").addEventListener("click", e => {

});

function setMode(m) {
  colorMode = m;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));

  lg.hidden = m !== "pay";

function where(w) {

const tl = n => n == null ? "—" : n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";

const tomap = document.getElementById("tomap");
new IntersectionObserver(([e]) => { tomap.hidden = e.isIntersecting; }, { threshold: 0.15 }).observe(document.getElementById("map"));
tomap.addEventListener("click", () => document.getElementById("map").scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));

// Sıfırla: seçimi, aramayı, filtreleri ve görünümü ilk açılış hâline döndür
function resetAll() {
  map.closePopup();
  if (selected && layers[selected]) layers[selected].lyr.setStyle(style(layers[selected].f, false));
  selected = null;
  q.value = ""; sortSel.value = "parsel";
  Object.keys(COLORS).forEach(n => active.add(n));
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "true"));
  wactive.clear();
  document.querySelectorAll(".wchip").forEach(c => c.setAttribute("aria-pressed", "false"));
  if (colorMode !== "tur") setMode("tur");
  render();
  document.getElementById("list").scrollTop = 0;
  map.flyToBounds(bounds, { padding: [20, 20], duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.8 });
}
const ResetCtl = L.Control.extend({
  options: { position: "topleft" },
  onAdd() {
    const bar = L.DomUtil.create("div", "leaflet-bar");
    const a = L.DomUtil.create("a", "reset", bar);
    a.href = "#"; a.title = "Sıfırla"; a.setAttribute("role", "button"); a.setAttribute("aria-label", "Haritayı sıfırla");
    a.innerHTML = `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    L.DomEvent.disableClickPropagation(bar);
    L.DomEvent.on(a, "click", e => { L.DomEvent.preventDefault(e); resetAll(); });
    return bar;
  }
});
new ResetCtl().addTo(map);

loadPack("lo");
// Kap henüz boyut almadan fitBounds en yakın zoom'a gider; boyut gelince bir kez sığdır
map.setView(bounds.getCenter(), 13);
let fitted = false;
// Sonraki boyut değişikliklerini Leaflet kendisi izler; gözlemci açık kalırsa uçuş animasyonunu yarıda keser
const ro = new ResizeObserver(() => {
  if (fitted) return;
  map.invalidateSize();
  const sz = map.getSize(); if (sz.x > 0 && sz.y > 0) { fitted = true; ro.disconnect(); map.fitBounds(bounds, { padding: [20, 20], animate: false }); syncLabels(); }
});
ro.observe(document.getElementById("map"));
render();
</script>
